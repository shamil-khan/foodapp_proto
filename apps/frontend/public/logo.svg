<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Food App Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="55%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="utensilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8C1D18" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Rounded square app icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle top-left gloss highlight -->
  <path d="M 112 0 H 400 A 112 112 0 0 1 512 112 V 160 C 380 120 180 180 0 260 V 112 A 112 112 0 0 1 112 0 Z" fill="#FFFFFF" opacity="0.08"/>

  <!-- Plate -->
  <circle cx="256" cy="256" r="154" fill="#FFFFFF" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#FFE3D8" stroke-width="6"/>

  <!-- Fork (Left) -->
  <g fill="url(#utensilGrad)">
    <!-- Three tines -->
    <rect x="184" y="164" width="12" height="58" rx="6"/>
    <rect x="206" y="164" width="12" height="58" rx="6"/>
    <rect x="228" y="164" width="12" height="58" rx="6"/>
    <!-- Fork shoulder -->
    <path d="M 184 212 C 184 240 202 250 204 256 V 262 H 220 V 256 C 222 250 240 240 240 212 Z"/>
    <!-- Fork handle -->
    <rect x="203" y="252" width="18" height="96" rx="9"/>
  </g>

  <!-- Spoon (Right) -->
  <g fill="url(#utensilGrad)">
    <!-- Spoon bowl -->
    <ellipse cx="300" cy="204" rx="28" ry="40"/>
    <!-- Spoon neck & handle -->
    <rect x="291" y="236" width="18" height="112" rx="9"/>
  </g>

  <!-- Subtle inner shine on spoon bowl -->
  <ellipse cx="292" cy="192" rx="7" ry="15" fill="#FFFFFF" opacity="0.28" transform="rotate(-10 292 192)"/>
</svg>